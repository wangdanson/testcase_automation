<h3>
 現況：
</h3>
<p>
 使用者會將 廣告組合名稱 命名超長，而且重複性很高如下圖，
</p>
<p>
 造成輸出 excel 報表的時候會產生兩個狀況
</p>
<ol>
 <li>
  <p>
   名稱超過一定長度時, 會截取至固定字元做輸出
  </p>
 </li>
 <li>
  <p>
   以下命名情境下, 三個 廣告組合名稱 截取出來的名稱結果都是一樣的,
   <br/>
   <strong>
    因次造成輸出名稱之結果重複命名並非 uniqe , 所以下載報表的錯誤因此產生。
   </strong>
  </p>
 </li>
</ol>
